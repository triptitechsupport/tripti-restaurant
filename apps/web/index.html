<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / installable app metadata -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8b1538" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tripti Genusswelt" />
    <meta name="application-name" content="Tripti Genusswelt" />
    <meta name="description" content="Tripti Genusswelt – authentisches indisches Restaurant in Villach. Speisekarte ansehen, Tisch reservieren und online bestellen." />

    <meta property="og:type" content="restaurant" />
    <meta property="og:site_name" content="Tripti Genusswelt" />
    <meta property="og:title" content="Tripti Genusswelt – Indisches Restaurant in Villach" />
    <meta property="og:description" content="Authentische indische Küche in Villach. Speisekarte ansehen, Tisch reservieren und online bestellen." />
    <meta property="og:image" content="/app-icon.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Tripti Genusswelt",
        "servesCuisine": "Indian",
        "telephone": "+436641219289",
        "email": "info@triptigenusswelt.at",
        "url": "https://triptigenusswelt.at/",
        "menu": "https://triptigenusswelt.at/menu",
        "acceptsReservations": "https://triptigenusswelt.at/table-reservation",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Italiener Straße 17",
          "postalCode": "9500",
          "addressLocality": "Villach",
          "addressCountry": "AT"
        }
      }
    </script>

    <title>Tripti Genusswelt – Indisches Restaurant in Villach</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Tripti Staff app: show the app's start screen until the page is ready.
      (function () {
        try {
          var app = /TriptiStaffApp/i.test(navigator.userAgent) || /[?&]app=1/.test(location.search) || localStorage.getItem('tripti_staff_app') === '1';
          if (/[?&]app=0/.test(location.search)) app = false;
          if (!app) return;
          document.documentElement.classList.add('staff-app');
          document.getElementById('root').innerHTML =
            '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#710D27;color:#fff;font-family:system-ui,sans-serif">' +
            '<img src="/app-icon.png" alt="" style="width:88px;height:88px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)">' +
            '<div style="font:700 26px Georgia,serif;letter-spacing:.3px">Tripti Staff</div>' +
            '<div style="width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:tsplash .8s linear infinite"></div>' +
            '<style>@keyframes tsplash{to{transform:rotate(360deg)}}</style></div>';
        } catch (e) { /* normal website */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Serve the dedicated Waiter app manifest on waiter routes so the
      // installed app is branded "Tripti Genusswelt - Waiter" and launches
      // straight into the waiter dashboard.
      (function () {
        try {
          if (location.pathname.indexOf('/waiter') === 0) {
            var link = document.querySelector('link[rel="manifest"]');
            if (link) link.setAttribute('href', '/waiter-manifest.webmanifest');
            var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (title) title.setAttribute('content', 'Tripti Genusswelt - Waiter');
            var appName = document.querySelector('meta[name="application-name"]');
            if (appName) appName.setAttribute('content', 'Tripti Genusswelt - Waiter');
          }
        } catch (e) {}
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // The Tripti Staff Android app always loads pages from the server
          // (it shows its own offline page), so no service worker there.
          if (/TriptiStaffApp/i.test(navigator.userAgent || '')) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
            return;
          }
          navigator.serviceWorker.register('/service-worker.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
